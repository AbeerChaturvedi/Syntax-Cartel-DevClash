name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend:
    name: backend · lint + test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: velure
          POSTGRES_USER: velure
          POSTGRES_PASSWORD: velure_hackathon_2026
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U velure"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATA_MODE: simulator
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: velure
      POSTGRES_PASSWORD: velure_hackathon_2026
      POSTGRES_DB: velure
      CORS_ORIGINS: "*"
      ALERT_THRESHOLD_HIGH: "0.7"
      ALERT_THRESHOLD_CRITICAL: "0.85"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          pip install --no-cache-dir \
            torch==2.4.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install test tools
        run: pip install --no-cache-dir pytest pytest-asyncio ruff

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Apply schema
        run: |
          PGPASSWORD=velure_hackathon_2026 psql \
            -h localhost -U velure -d velure -v ON_ERROR_STOP=1 \
            -f backend/db/schema.sql

      - name: Run tests
        working-directory: backend
        run: pytest -q --tb=short

  frontend:
    name: frontend · lint + build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/dashboard
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: docker · compose build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        working-directory: backend
        run: docker buildx build --tag velure-backend:test .

      - name: Build frontend image
        working-directory: frontend
        run: docker buildx build --tag velure-frontend:test .