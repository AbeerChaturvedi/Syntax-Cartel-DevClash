[project]
name = "velure-backend"
version = "0.1.0"
description = "Project Velure — real-time financial crisis early warning system (backend)."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Team Syntax Cartel" },
]
readme = "../README.md"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend", "tests"]
addopts = "-ra --strict-markers --tb=short"
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
  ".venv",
  "frontend",
  "crisis-simulation-data",
  "**/node_modules",
  "**/__pycache__",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort (import order)
  "B",   # bugbear (likely bugs)
  "UP",  # pyupgrade (modern syntax)
  "SIM", # simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501",   # line length — handled by formatter
  "B008",   # function-call-in-default-arg — common in FastAPI dependencies
  "B904",   # raise-without-from-inside-except — let ruff E maintain context
]

[tool.ruff.lint.per-file-ignores]
"backend/Routes/*.py" = ["B"]  # routers often use FastAPI magic in defaults
"backend/**/tests/*.py" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
  "frontend",
  "crisis-simulation-data",
  "data",
  ".venv",
]
